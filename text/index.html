<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Text Mechler</title>
  <meta name="theme-color" content="#FFFFFF">
  <style>
    :root{
      --blue:#100B28;
      --gold:#B89A5A;
      --bg:#FFFFFF;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--blue);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    }

    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:32px 24px;
    }

    main{
      width:min(460px,100%);
      text-align:center;
    }

    .rule{
      width:42px;
      height:2px;
      background:var(--gold);
      margin:0 auto 28px;
    }

    h1{
      margin:0 0 32px;
      font-size:clamp(46px,12vw,74px);
      line-height:.96;
      letter-spacing:-.055em;
      font-weight:800;
      color:var(--blue);
    }

    a{
      display:inline-block;
      min-width:220px;
      padding:18px 28px;
      border:2px solid var(--blue);
      background:var(--blue);
      color:#FFFFFF;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:15px;
      line-height:1;
      font-weight:800;
      border-radius:0;
      transition:transform .12s ease, opacity .12s ease;
    }

    a:active{
      transform:scale(.985);
      opacity:.92;
    }

    @media (hover:hover){
      a:hover{opacity:.9}
    }
  </style>
</head>
<body>
  <main>
    <div class="rule" aria-hidden="true"></div>
    <h1>Let’s get started.</h1>
    <a href="sms:+15129372696">Text Mechler</a>
  </main>
</body>
</html>
